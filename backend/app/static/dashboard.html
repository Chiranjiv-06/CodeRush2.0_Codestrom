<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2X Compute &amp; Tool Exchange - Standalone UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d16;
    --bg-mesh: radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
              radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.12) 0%, transparent 45%),
              radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
    --surface: rgba(19, 27, 44, 0.75);
    --surface-solid: #111827;
    --surface-2: rgba(30, 41, 59, 0.65);
    --surface-hover: rgba(30, 41, 59, 0.9);
    --border: rgba(255, 255, 255, 0.09);
    --border-glow: rgba(59, 130, 246, 0.3);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --accent-soft: rgba(56, 189, 248, 0.12);
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, 0.12);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.12);
    --bad: #f87171;
    --bad-soft: rgba(248, 113, 113, 0.12);
    --asa: #a78bfa;
    --asa-soft: rgba(167, 139, 250, 0.12);
    --vibe: #ec4899;
    --vibe-soft: rgba(236, 72, 153, 0.12);
    --mono: "Fira Code", monospace;
    --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; min-height: 100vh; }
  body {
    background-color: var(--bg);
    background-image: var(--bg-mesh);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.55 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: 12px; }

  /* Chrome & Sticky Navigation */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(9, 13, 22, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  }
  .brand {
    font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #38bdf8, #34d399, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    display: flex; align-items: center; gap: 8px; margin-right: auto;
  }
  .brand small {
    display: block; color: var(--muted); font-weight: 400; font-size: 11px;
    -webkit-text-fill-color: var(--muted); letter-spacing: normal;
  }

  .header-badges { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .asset-badge {
    display: flex; align-items: center; gap: 12px;
    background: var(--asa-soft); border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 9999px; padding: 6px 14px; transition: all 0.2s ease;
  }
  .asset-badge:hover { border-color: var(--asa); box-shadow: 0 0 12px var(--asa-soft); }
  .asset-badge .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; }
  .asset-badge .value { font-weight: 600; color: var(--asa); font-size: 12px; }
  .asset-badge .net { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .status-pill {
    display: flex; align-items: center; gap: 6px; font-size: 11px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 9999px; color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.blue { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.purple { background: var(--asa); box-shadow: 0 0 8px var(--asa); }

  nav {
    position: sticky; top: 61px; z-index: 90;
    display: flex; gap: 4px; padding: 6px 20px;
    background: rgba(13, 17, 26, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: thin;
  }
  nav button {
    background: transparent; border: 1px solid transparent;
    color: var(--muted); padding: 7px 14px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    white-space: nowrap; transition: all 0.2s ease;
  }
  nav button:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
  nav button.on {
    color: var(--accent); background: var(--accent-soft);
    border-color: rgba(56, 189, 248, 0.3); font-weight: 600;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
  }

  main { padding: 24px; max-width: 1360px; margin: 0 auto; width: 100%; flex: 1; }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
  h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #e2e8f0; }
  .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; line-height: 1.5; }
  .hint.tight { margin: 0; }

  /* Cards & Layouts */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow); transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover { border-color: rgba(255, 255, 255, 0.15); }
  .card + .card { margin-top: 14px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spread { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .toolbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }

  /* Buttons & Controls */
  button.act {
    background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff;
    border: none; border-radius: 8px; padding: 8px 16px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35); transition: all 0.2s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button.act:hover:not(:disabled) {
    transform: translateY(-1px); filter: brightness(1.1);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
  }
  button.ghost {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease;
  }
  button.ghost:hover:not(:disabled) {
    border-color: var(--accent); color: var(--accent); background: var(--surface-hover);
  }
  button.algo {
    background: linear-gradient(135deg, #0d9488, #059669); color: #fff;
    border: none; border-radius: 8px; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35); transition: all 0.2s ease;
  }
  button.algo:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 6px 20px rgba(13, 148, 136, 0.5); }
  button.vibe {
    background: linear-gradient(135deg, #9333ea, #c026d3); color: #fff;
    border: none; border-radius: 8px; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35); transition: all 0.2s ease;
  }
  button.vibe:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 6px 20px rgba(147, 51, 234, 0.5); }

  button.danger {
    background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: all 0.2s ease;
  }
  button.danger:hover:not(:disabled) { background: rgba(248, 113, 113, 0.2); border-color: var(--bad); }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12.5px; padding: 0; }
  button.link:hover { text-decoration: underline; }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  label { font-size: 11.5px; font-weight: 500; color: var(--muted); }
  input, textarea, select {
    background: rgba(11, 15, 25, 0.6); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font: inherit; font-size: 13px; width: 100%;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  textarea { font-family: var(--mono); font-size: 12.5px; min-height: 90px; resize: vertical; }
  input[type=checkbox] { width: auto; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }

  /* Badges & Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 9999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); background: var(--ok-soft); border-color: rgba(52, 211, 153, 0.3); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); border-color: rgba(251, 191, 36, 0.3); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); border-color: rgba(248, 113, 113, 0.3); }
  .pill.asa { color: var(--asa); background: var(--asa-soft); border-color: rgba(167, 139, 250, 0.3); }
  .pill.vibe { color: var(--vibe); background: var(--vibe-soft); border-color: rgba(236, 72, 153, 0.3); }
  .pill.info { color: var(--accent); background: var(--accent-soft); border-color: rgba(56, 189, 248, 0.3); }

  .asset-strip {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--asa-soft); border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 10px; padding: 10px 14px; margin: 12px 0;
  }
  .asset-strip .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .asset-strip .v { font-weight: 650; color: var(--asa); font-size: 13px; }

  /* Data Tables */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(255, 255, 255, 0.02); }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .scroll { overflow-x: auto; scrollbar-width: thin; }

  /* Key-Value Lists */
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 12.5px; margin: 0; }
  dl.kv dt { color: var(--muted); font-weight: 500; }
  dl.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }

  /* Stats Tiles */
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow);
    transition: transform 0.2s ease;
  }
  .stat:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.15); }
  .stat .n { font-size: 22px; font-weight: 700; font-family: var(--mono); line-height: 1.2; background: linear-gradient(135deg, #f8fafc, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat .l { color: var(--muted); font-size: 11.5px; margin-top: 4px; font-weight: 500; }

  /* Terminal Console */
  .terminal-console {
    background: #020617; border: 1px solid #1e293b;
    border-radius: 10px; padding: 14px; font-family: var(--mono);
    font-size: 12px; color: #a7f3d0; height: 260px; overflow-y: auto;
    white-space: pre-wrap; line-height: 1.6; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
  }

  .empty { color: var(--muted); font-size: 13px; padding: 28px; text-align: center; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Step Timelines */
  .steps { display: flex; flex-direction: column; gap: 0; margin: 8px 0 0; }
  .step { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
  .step .dot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: 0 0 auto;
    margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff;
    transition: all 0.3s ease;
  }
  .step.done .dot { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 10px var(--ok-soft); }
  .step.active .dot { border-color: var(--accent); border-top-color: transparent; animation: spin 0.7s linear infinite; }
  .step.fail .dot { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 10px var(--bad-soft); }
  .step .t { font-size: 13px; font-weight: 500; }
  .step .d { font-size: 11.5px; color: var(--muted); font-family: var(--mono); word-break: break-all; margin-top: 2px; }
  .step.pending .t { color: var(--muted); }

  /* Toast Notification Wrap */
  .toast-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; max-width: min(460px, 92vw); }
  .toast {
    background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 12px 16px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1); color: #f8fafc;
  }
  .toast.bad { border-left-color: var(--bad); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.96); } }

  details > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); padding: 4px 0; font-weight: 500; }
  details[open] > summary { margin-bottom: 8px; }
  pre {
    background: rgba(2, 6, 23, 0.7); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px;
    margin: 8px 0 0; max-height: 360px; color: #cbd5e1;
  }
  .trace { border-left: 2px solid rgba(56, 189, 248, 0.3); padding-left: 12px; margin-left: 4px; }
  .trace .ev { padding: 5px 0; font-size: 12.5px; }
  .trace .ev .n { font-family: var(--mono); color: var(--accent); font-size: 11.5px; font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>M2X Exchange</span>
    <small id="brandSub">connecting…</small>
  </div>

  <div class="header-badges">
    <div class="asset-badge" title="Authorized and settled on Algorand">
      <div>
        <span class="label">Payment Asset</span>
        <span class="value" id="assetDisplay">Algorand ASA #10458941</span>
      </div>
      <span class="net" id="assetNet">Algorand · TestNet</span>
    </div>

    <div class="status-pill" id="hdrAlgoStatus" title="AlgoKit Node Connection">
      <span class="dot green"></span>
      <span id="hdrAlgoTxt">Algorand Online</span>
    </div>

    <div class="status-pill" id="hdrVibeStatus" title="VibeKit Agent Sandbox Status">
      <span class="dot blue"></span>
      <span id="hdrVibeTxt">VibeKit Ready</span>
    </div>
  </div>

  <div class="row" id="authBox"></div>
</header>

<nav id="tabs"></nav>
<main id="view"><div class="empty"><span class="spinner"></span> initializing exchange dashboard…</div></main>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";

/* ========================================================================== *
 * Application State
 * ========================================================================== */
var S = {
  token: localStorage.getItem("m2x_token") || "",
  user: JSON.parse(localStorage.getItem("m2x_user") || "null"),
  asset: null,
  services: [],
  providers: [],
  route: "",
  timer: null,
  live: false,
};

/* ========================================================================== *
 * DOM Helper
 * ========================================================================== */
function h(tag, props) {
  var n = document.createElement(tag), i, k, kid, kids = [];
  for (i = 2; i < arguments.length; i++) kids = kids.concat(arguments[i]);
  if (props) {
    for (k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
      var v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else if (k === "value") n.value = v;
      else if (k === "checked" || k === "disabled" || k === "selected") n[k] = !!v;
      else n.setAttribute(k, v);
    }
  }
  for (i = 0; i < kids.length; i++) {
    kid = kids[i];
    if (kid === null || kid === undefined || kid === false || kid === "") continue;
    n.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
var $ = function (id) { return document.getElementById(id); };

/* ========================================================================== *
 * Formatting Helpers
 * ========================================================================== */
function amount(micros) { return (Number(micros || 0) / 1e6).toFixed(6); }
function toMicros(units) { return Math.round(Number(units || 0) * 1e6); }
function short(s, n) { n = n || 18; s = String(s == null ? "" : s); return !s ? "—" : (s.length > n ? s.slice(0, n) + "…" : s); }
function when(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleString();
}
function statusClass(s) {
  if (["succeeded", "settled", "completed", "resolved_provider", "escrowed", "valid"].indexOf(s) >= 0) return "ok";
  if (["failed", "cancelled", "expired", "refunded", "disputed", "rejected", "broken", "invalid"].indexOf(s) >= 0) return "bad";
  return "warn";
}

/* ========================================================================== *
 * API Communications
 * ========================================================================== */
function api(path, opts) {
  opts = opts || {};
  var headers = { "Content-Type": "application/json" };
  if (S.token) headers["Authorization"] = "Bearer " + S.token;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
  return fetch(path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
  }).then(function (res) {
    return res.text().then(function (text) {
      var data = null;
      if (text) { try { data = JSON.parse(text); } catch (e) { data = { detail: text }; } }
      if (res.status === 401 && S.token) signOut(true);
      return { ok: res.ok, status: res.status, data: data, headers: res.headers };
    });
  }).catch(function (err) {
    return { ok: false, status: 0, data: { detail: "Network error: " + err.message }, headers: new Headers() };
  });
}

function detail(res, fallback) {
  var d = res && res.data;
  if (!d) return fallback || ("Request failed (" + (res ? res.status : "?") + ")");
  if (typeof d.detail === "string") return d.detail;
  if (Array.isArray(d.detail)) {
    return d.detail.map(function (e) {
      var loc = Array.isArray(e.loc) ? e.loc[e.loc.length - 1] + ": " : "";
      return loc + (e.msg || JSON.stringify(e));
    }).join("; ");
  }
  if (d.error) return d.error;
  return fallback || ("Request failed (" + res.status + ")");
}

function toast(message, kind) {
  var t = h("div", { class: "toast " + (kind || "") }, message);
  $("toasts").appendChild(t);
  setTimeout(function () {
    t.style.transition = "all .3s ease"; t.style.opacity = "0"; t.style.transform = "translateY(10px)";
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
  }, kind === "bad" ? 6000 : 4000);
}

function busy(btn, fn) {
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  return Promise.resolve().then(fn).catch(function (e) {
    toast(e && e.message ? e.message : String(e), "bad");
  }).then(function () {
    btn.disabled = false; btn.textContent = label;
  });
}

function copy(text) {
  var done = function () { toast("Copied to clipboard.", "ok"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(String(text)).then(done, function () { fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
}

/* ========================================================================== *
 * View: Run a Job (Interactive x402 Console)
 * ========================================================================== */
function viewRun() {
  return loadCatalog().then(function () {
    var wrap = h("div");
    var preselect = "";
    var m = /service=([\w-]+)/.exec(location.hash);
    if (m) preselect = m[1];

    var select = h("select", null, S.services.map(function (s) {
      return h("option", { value: s.id, selected: s.id === preselect },
        s.name + " — " + amount(s.max_price_micros) + " max");
    }));
    var payload = h("textarea", null);
    payload.value = JSON.stringify(sampleFor(serviceById(preselect || (S.services[0] || {}).id)), null, 2);
    select.addEventListener("change", function () {
      payload.value = JSON.stringify(sampleFor(serviceById(select.value)), null, 2);
    });

    var timeline = h("div");
    var output = h("div");
    var runBtn = h("button", { class: "act", onclick: function () { start(); } }, "Pay & Execute (x402)");

    payload.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runBtn.click(); }
    });

    wrap.appendChild(h("h2", null, "Run Job via x402 Protocol"));
    wrap.appendChild(h("p", { class: "hint" },
      "Interactive 6-stage x402 payment lifecycle: Request → 402 Challenge → Authorization Signature → Preflight Checks → Sandbox Execution → Receipt Issuance."));
    wrap.appendChild(h("div", { class: "card" },
      h("div", { class: "toolbar", style: "margin:0 0 12px" },
        h("div", { class: "field", style: "flex:2" }, h("label", null, "Target Service"), select),
        h("div", { class: "field" }, h("label", null, "Available Balance"),
          h("div", { class: "mono", id: "runBalance", style: "font-weight:600; padding:6px 0" }, "—"))),
      field("Input Payload (JSON) — press Ctrl+Enter to submit", payload),
      h("div", { class: "row", style: "margin-top:12px" }, runBtn,
        h("button", { class: "ghost", onclick: function () {
          payload.value = JSON.stringify(sampleFor(serviceById(select.value)), null, 2);
        } }, "Reset Sample Payload"),
        h("span", { class: "hint tight", id: "runNote" }, ""))));
    wrap.appendChild(timeline);
    wrap.appendChild(output);

    refreshBalance().then(function (b) {
      if (b && $("runBalance")) $("runBalance").textContent = amount(b.available_micros);
    });

    var STEP_DEFS = [
      ["quote", "Resource Invocation Request"],
      ["challenge", "402 Payment Required Challenge Received"],
      ["sign", "Sign Cryptographic x402 Authorization"],
      ["validate", "Pre-Execution Safety & Balance Preflight"],
      ["execute", "Escrow Settlement & Sandbox Execution"],
      ["receipt", "Signed Settlement Receipt Written to Chain"],
    ];

    function start() {
      if (!S.user) { toast("Please sign in first.", "bad"); return; }
      var serviceId = select.value;
      if (!serviceId) { toast("Select a target service.", "bad"); return; }
      var body;
      try { body = JSON.parse(payload.value || "{}"); }
      catch (e) { toast("Payload JSON syntax error: " + e.message, "bad"); return; }

      output.innerHTML = "";
      timeline.innerHTML = "";
      var card = h("div", { class: "card", style: "margin-top:14px" }, h("h3", null, "x402 Protocol Execution Cycle"));
      var list = h("div", { class: "steps" });
      var nodes = {};
      STEP_DEFS.forEach(function (d) {
        var detailLine = h("div", { class: "d" }, "");
        var row = h("div", { class: "step pending" },
          h("div", { class: "dot" }, ""), h("div", null, h("div", { class: "t" }, d[1]), detailLine));
        nodes[d[0]] = { row: row, detail: detailLine };
        list.appendChild(row);
      });
      card.appendChild(list);
      timeline.appendChild(card);

      function mark(key, state, text) {
        var n = nodes[key];
        if (!n) return;
        n.row.className = "step " + state;
        n.row.firstChild.textContent = state === "done" ? "✓" : state === "fail" ? "✕" : "";
        if (text !== undefined) n.detail.textContent = text;
      }

      runBtn.disabled = true;
      $("runNote").textContent = "Executing x402 cycle…";
      mark("quote", "active");

      api("/v1/services/" + serviceId + "/invoke", { method: "POST", body: body })
        .then(function (challenge) {
          if (challenge.status !== 402) {
            mark("quote", "fail", detail(challenge, "Expected 402 challenge"));
            throw new Error(detail(challenge, "Expected 402 challenge"));
          }
          mark("quote", "done", "Job ID: " + challenge.data.job_id);
          var req = challenge.data.accepts[0];
          mark("challenge", "done",
            "Asset: ASA #" + (req.extra && req.extra.assetId ? req.extra.assetId : req.asset) +
            " · Max: " + amount(req.maxAmountRequired) + " · Network: " + req.network);
          output.appendChild(challengeCard(challenge.data, req));

          mark("sign", "active");
          return api("/v1/payments/sign", { method: "POST", body: { payment_id: challenge.data.payment_id } })
            .then(function (signed) {
              if (!signed.ok) { mark("sign", "fail", detail(signed, "Signing failed")); throw new Error(detail(signed, "Signing failed")); }
              mark("sign", "done", "Authorization payload signed for ASA #" + signed.data.asset_id);

              mark("validate", "active");
              return api("/v1/jobs/" + challenge.data.job_id + "/preflight").then(function (pre) {
                if (pre.ok) {
                  var failed = pre.data.failed || [];
                  var blocking = failed.filter(function (f) { return f !== "payment_authorization"; });
                  mark("validate", blocking.length ? "fail" : "done",
                    blocking.length ? "Blocked: " + blocking.join(", ")
                                    : "Network, Asset, Wallet & Seller preflight checks passed");
                  output.appendChild(preflightCard(pre.data));
                } else mark("validate", "done", "");

                mark("execute", "active");
                return api("/v1/services/" + serviceId + "/invoke", {
                  method: "POST", body: body, headers: { "X-PAYMENT": signed.data.x_payment },
                });
              });
            })
            .then(function (paid) {
              var settlement = null;
              var raw = paid.headers.get("X-PAYMENT-RESPONSE");
              if (raw) { try { settlement = JSON.parse(atob(raw)); } catch (e) { settlement = null; } }
              var ok = paid.data && paid.data.status === "succeeded";
              mark("execute", ok ? "done" : "fail",
                settlement ? "Tx: " + short(settlement.transaction, 22) + " · Asset ID: " + settlement.assetId
                           : detail(paid, "Execution failed"));
              mark("receipt", ok ? "done" : "fail",
                ok ? "Receipt recorded on cryptographic hash chain" : "Execution failed — escrow refunded");
              output.appendChild(resultCard(paid, settlement));
              toast(ok ? "Job executed and settled on Algorand!" : "Job failed — escrow refunded.", ok ? "ok" : "bad");
              return refreshBalance().then(function (b) {
                if (b && $("runBalance")) $("runBalance").textContent = amount(b.available_micros);
              });
            });
        })
        .catch(function (err) {
          toast(err && err.message ? err.message : String(err), "bad");
        })
        .then(function () {
          runBtn.disabled = false;
          $("runNote").textContent = "";
        });
    }
    return wrap;
  });
}

function jobCard(job, open, reload) {
  var card = h("div", { class: "card" });

  card.appendChild(h("div", { class: "spread" },
    h("div", null,
      h("strong", { style: "font-size:15px" }, svc ? svc.name : job.service_id),
      h("div", { class: "hint tight mono" }, job.id)),
    h("div", { class: "row" },
      h("span", { class: "pill " + statusClass(job.status) }, job.status),
      job.integrity_verified ? h("span", { class: "pill ok" }, "integrity ✓") : null)));

  card.appendChild(h("div", { class: "hint", style: "margin:8px 0 0" },
    "Quoted: " + amount(job.quoted_price_micros) + " · Charged: " + amount(job.final_price_micros) +
    " · Fee: " + amount(job.platform_fee_micros) + " · Attempt: " + job.attempts + "/" + job.max_attempts +
    " · Created: " + when(job.created_at)));

  var body = h("div");
  var expanded = false;
  var toggle = h("button", { class: "link", onclick: function () {
    expanded = !expanded;
    toggle.textContent = expanded ? "Hide Details" : "View Details";
    body.innerHTML = "";
    if (expanded) loadDetails();
  } }, open ? "Hide Details" : "View Details");

  function loadDetails() {
    body.appendChild(loading());
    Promise.all([
      api("/v1/jobs/" + job.id + "/events"),
      api("/v1/jobs/" + job.id + "/artifacts"),
      api("/v1/jobs/" + job.id + "/preflight"),
    ]).then(function (r) {
      body.innerHTML = "";
      var events = r[0], artifacts = r[1], pre = r[2];

      if (pre.ok) {
        body.appendChild(h("h3", { style: "margin-top:12px" }, "Preflight Validation"));
        body.appendChild(table(["Check", "Result", "Details"], pre.data.checks.map(function (c) {
          return [c.check, h("span", { class: "pill " + (c.ok ? "ok" : "warn") }, c.ok ? "pass" : "pending"),
                  h("span", { class: "mono" }, c.detail)];
        })));
      }

      if (events.ok && events.data.length) {
        body.appendChild(h("h3", { style: "margin-top:14px" }, "Event Lifecycle Trace"));
        var trace = h("div", { class: "trace" });
        events.data.forEach(function (e) {
          trace.appendChild(h("div", { class: "ev" },
            h("span", { class: "n" }, e.kind), " ", e.message || "",
            h("div", { class: "hint tight" }, when(e.created_at) +
              (e.data && e.data.asset_id ? " · Asset #" + e.data.asset_id : ""))));
        });
        body.appendChild(trace);
      }

      if (artifacts.ok && artifacts.data.length) {
        body.appendChild(h("h3", { style: "margin-top:14px" }, "Job Output Artifacts"));
        body.appendChild(table(["Artifact Name", { label: "Size (Bytes)", num: true }, "SHA-256", ""],
          artifacts.data.map(function (a) {
            return [a.name, a.size_bytes, h("span", { class: "mono" }, short(a.sha256, 20)),
              h("button", { class: "ghost", onclick: function (e) { downloadArtifact(a, e.target); } }, "Download")];
          })));
      }

      if (job.result) body.appendChild(jsonBlock("Job Result JSON", job.result));
      if (job.error) body.appendChild(h("pre", null, job.error));
    });
  }

  var actions = h("div", { class: "row", style: "margin-top:10px" }, toggle);
  if (job.status === "queued") {
    var ex = h("button", { class: "ghost", onclick: function () {
      busy(ex, function () {
        return api("/v1/jobs/" + job.id + "/execute", { method: "POST" }).then(function (res) {
          toast(res.ok ? "Execution completed." : detail(res, "Could not execute"), res.ok ? "ok" : "bad");
          if (res.ok) reload();
        });
      });
    } }, "Execute Now");
    actions.appendChild(ex);
  }
  if (job.status === "failed" && job.attempts < job.max_attempts) {
    var rt = h("button", { class: "ghost", onclick: function () {
      busy(rt, function () {
        return api("/v1/jobs/" + job.id + "/retry?auto_pay=true", { method: "POST" }).then(function (res) {
          toast(res.ok ? "Retry paid & queued." : detail(res, "Retry failed"), res.ok ? "ok" : "bad");
          if (res.ok) reload();
        });
      });
    } }, "Retry (Auto-Pay)");
    actions.appendChild(rt);
  }
  if (["quoted", "awaiting_payment", "queued", "running"].indexOf(job.status) >= 0) {
    var cx = h("button", { class: "danger", onclick: function () {
      busy(cx, function () {
        return api("/v1/jobs/" + job.id + "/cancel", { method: "POST" }).then(function (res) {
          toast(res.ok ? "Cancelled and refunded." : detail(res, "Could not cancel"), res.ok ? "ok" : "bad");
          if (res.ok) reload();
        });
      });
    } }, "Cancel & Refund");
    actions.appendChild(cx);
  }
  if (["succeeded", "failed"].indexOf(job.status) >= 0) {
    var dp = h("button", { class: "ghost", onclick: function () {
      var reason = prompt("Enter dispute reason (e.g., quality, non_delivery, overcharge):", "quality");
      if (!reason) return;
      busy(dp, function () {
        return api("/v1/disputes", { method: "POST", body: { job_id: job.id, reason: reason, detail: "" } })
          .then(function (res) {
            if (!res.ok) { toast(detail(res, "Could not open dispute"), "bad"); return; }
            return api("/v1/disputes/" + res.data.id + "/triage", { method: "POST" }).then(function (tri) {
              toast(tri.ok ? "Dispute triaged: " + tri.data.status + " — " + (tri.data.resolution || "") : "Dispute created.",
                    tri.ok ? "ok" : "");
              reload();
            });
          });
      });
    } }, "Open Dispute");
    actions.appendChild(dp);
  }
  actions.appendChild(copyBtn(job.id, "copy id"));
  card.appendChild(actions);
  card.appendChild(body);
  if (open) { expanded = true; loadDetails(); }
  return card;
}

function downloadArtifact(artifact, btn) {
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "…";
  fetch("/v1/artifacts/" + artifact.id, { headers: { Authorization: "Bearer " + S.token } })
    .then(function (res) {
      if (!res.ok) throw new Error("Download failed (" + res.status + ")");
      return res.blob();
    })
    .then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = h("a", { href: url, download: artifact.name });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast("Downloaded " + artifact.name + ".", "ok");
    })
    .catch(function (e) { toast(e.message, "bad"); })
    .then(function () { btn.disabled = false; btn.textContent = label; });
}

          max_price_micros: toMicros(maxPrice.value),
        };
        if (cron.value.trim()) body.cron = cron.value.trim();
        else body.interval_seconds = Number(interval.value);
        return api("/v1/schedules", { method: "POST", body: body }).then(function (res) {

          res.data.map(function (s) {

            var toggleBtn = h("button", { class: "ghost", onclick: function () {
              busy(toggleBtn, function () {
                return api("/v1/schedules/" + s.id + "?enabled=" + (!s.enabled), { method: "PATCH" })
                  .then(function (r) {
                    toast(r.ok ? (s.enabled ? "Schedule paused." : "Schedule resumed.") : detail(r, "Toggle failed"), r.ok ? "ok" : "bad");
                    if (r.ok) load();

              });
            } }, s.enabled ? "Pause" : "Resume");
            var del = h("button", { class: "danger", onclick: function () {
              busy(del, function () {
                return api("/v1/schedules/" + s.id, { method: "DELETE" }).then(function (r) {
                  toast(r.ok ? "Schedule deleted." : detail(r, "Delete failed"), r.ok ? "ok" : "bad");
                  if (r.ok) load();
                });
              });
            } }, "Delete");
            return [s.name || "—", svc ? svc.name : s.service_id,
                    s.cron || (s.interval_seconds + "s"), when(s.next_run_at), s.run_count,
                    h("span", { class: "pill " + (s.enabled ? "ok" : "") }, s.enabled ? "enabled" : "paused"),
                    h("div", { class: "row" }, toggleBtn, del)];
          }))));
      });

      h("div", { style: "margin-top:8px" }, cronNote)));

    load();

  });

function receiptCard(rc) {
  var pay = (rc.body && rc.body.payment) || {};
  var status = String(pay.settlement_status || "unknown");
  var card = h("div", { class: "card" });

  card.appendChild(h("div", { class: "spread" },
    h("strong", { style: "font-size:15px" }, "Receipt #" + rc.sequence),
    h("span", { class: "pill " + statusClass(status) }, status)));

  card.appendChild(kv([
    ["Blockchain", pay.blockchain || "Algorand"],
    ["Network", pay.network || "TestNet"],
    ["Asset ID", pay.asset_id == null ? "—" : pay.asset_id],
    ["Transaction ID", pay.transaction_id || "—"],
    ["Settlement Status", status],
    ["Charged Amount", amount(pay.charged_micros)],
    ["Refunded Amount", amount(pay.refunded_micros)],
    ["Job ID", rc.job_id],
    ["Chain Link Hash", rc.chain_hash],
  ]));

  var note = h("span", { class: "hint tight", style: "color:var(--accent)" });
  var verify = h("button", { class: "ghost", onclick: function () {
    busy(verify, function () {
      return api("/v1/receipts/" + rc.id + "/verify").then(function (res) {
        if (!res.ok) { note.textContent = detail(res, "Verification failed"); return; }
        if (res.data.valid) {
          note.textContent = "Signature, payload hash & link verified ✓";
        } else {
          var bad = Object.keys(res.data.checks).filter(function (k) { return !res.data.checks[k]; });
          note.textContent = "INVALID: " + bad.join(", ");
        }
      });
    });
  } }, "Verify Signature & Hash");

  card.appendChild(h("div", { class: "row", style: "margin-top:10px" },
    verify, copyBtn(rc.chain_hash, "copy chain hash"), note));
  card.appendChild(jsonBlock("Full Cryptographic Receipt Body", rc.body));
  return card;
}

      card.appendChild(assetStrip());
      card.appendChild(h("div", { class: "tiles" },
        stat("Available Balance", amount(b.available_micros)),
        stat("In Escrow", amount(b.escrow_micros)),
        stat("Lifetime Earned", amount(b.lifetime_earned_micros)),
        stat("Lifetime Spent", amount(b.lifetime_spent_micros))));

      var topup = h("input", { type: "number", step: "1", value: "5" });
      var faucet = h("button", { class: "act", onclick: function () {
        busy(faucet, function () {
          return api("/v1/auth/topup", { method: "POST", body: { amount_micros: toMicros(topup.value) } })
            .then(function (res) {
              if (!res.ok) { toast(detail(res, "Faucet error"), "bad"); return; }
              toast("Testnet funds credited! New balance: " + amount(res.data.available_micros) + ".", "ok");
              refreshBalance(); render();
            });
        });
      } }, "Credit TestNet Funds");
      card.appendChild(h("div", { class: "toolbar", style: "margin:14px 0 0" },
        field("Faucet Credit Amount (Units)", topup), faucet));
      card.appendChild(kv([
        ["Account ID", b.account_id],
        ["Wallet Address", h("span", { class: "row" }, S.user.wallet_address || "—",
          S.user.wallet_address ? copyBtn(S.user.wallet_address) : null)],
        ["User Role", S.user.role],
      ]));
      wrap.appendChild(card);
    }

    var keyCard = h("div", { class: "card", style: "margin-top:14px" });
    keyCard.appendChild(h("h3", null, "Machine API Keys (MCP & A2A)"));
    keyCard.appendChild(h("p", { class: "hint" },
      "Credentials for automated agents connecting via Model Context Protocol (MCP) or Agent-to-Agent (A2A)."));
    var keyName = h("input", { placeholder: "agent-worker-1" });
    var out = h("div");
    var mk = h("button", { class: "act", onclick: function () {
      busy(mk, function () {
        return api("/v1/auth/api-keys", { method: "POST", body: { name: keyName.value.trim() || "default", scopes: [] } })
          .then(function (res) {
            if (!res.ok) { toast(detail(res, "Could not create API key"), "bad"); return; }
            out.innerHTML = "";
            out.appendChild(h("div", { class: "card", style: "margin-top:12px" },
              h("h3", null, "Copy secret now — it will not be displayed again"),
              h("pre", null, res.data.key),
              h("div", { class: "row" }, copyBtn(res.data.key, "copy secret"))));
            render();
          });
      });
    } }, "Create API Key");
    keyCard.appendChild(h("div", { class: "toolbar", style: "margin:0" }, field("Key Name", keyName), mk));
    keyCard.appendChild(out);

    if (keys.ok && keys.data.length) {
      keyCard.appendChild(h("div", { class: "scroll", style: "margin-top:12px" }, table(
        ["Key Name", "Prefix", "Created", "Last Used", "Status", ""],
        keys.data.map(function (k) {
          var rv = h("button", { class: "danger", disabled: k.revoked, onclick: function () {
            busy(rv, function () {
              return api("/v1/auth/api-keys/" + k.id, { method: "DELETE" }).then(function (res) {
                toast(res.ok ? "API Key revoked." : detail(res, "Could not revoke key"), res.ok ? "ok" : "bad");
                if (res.ok) render();
              });
            });
          } }, "Revoke");
          return [k.name, h("span", { class: "mono" }, k.prefix), when(k.created_at),
                  k.last_used_at ? when(k.last_used_at) : "never",
                  h("span", { class: "pill " + (k.revoked ? "bad" : "ok") }, k.revoked ? "revoked" : "active"), rv];
        }))));
    }
    wrap.appendChild(keyCard);

    var secretCard = h("div", { class: "card", style: "margin-top:14px" });
    var secretOut = h("div");
    secretCard.appendChild(h("h3", null, "x402 Payment Signing Key Secret"));
    secretCard.appendChild(h("p", { class: "hint" },
      "Secret key used to generate signed x402 headers client-side. Keep private."));
    var reveal = h("button", { class: "ghost", onclick: function () {
      busy(reveal, function () {
        return api("/v1/auth/payment-secret").then(function (res) {
          if (!res.ok) { toast(detail(res, "Unavailable"), "bad"); return; }
          secretOut.innerHTML = "";
          secretOut.appendChild(kv([
            ["Payer Address", res.data.payer],
            ["Signing Secret", h("span", { class: "row" }, res.data.payment_secret, copyBtn(res.data.payment_secret))],
          ]));
        });
      });
    } }, "Reveal Signing Secret");
    secretCard.appendChild(h("div", { class: "row" }, reveal));
    secretCard.appendChild(secretOut);
    wrap.appendChild(secretCard);

    return wrap;
  });
}

/* ========================================================================== *
 * Application Initialization
 * ========================================================================== */
api("/v1/config").then(function (cfg) {
  if (cfg.ok) {
    S.asset = cfg.data.payment_asset;
    $("assetDisplay").textContent = S.asset.display;
    $("assetNet").textContent = S.asset.blockchain + " · " + S.asset.network;
    $("brandSub").textContent = cfg.data.app_name + " v" + cfg.data.version + " · " + cfg.data.env;
    document.title = "M2X · " + S.asset.display;
  } else {
    $("brandSub").textContent = "API Unreachable";
    toast("Could not reach API server at http://localhost:8000.", "bad");
  }
  renderAuth();
  render();
});
</script>
</body>
</html>
